name: Release Label Guard

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  release-label:
    name: Validate release label
    runs-on: ubuntu-latest

    steps:
      - name: Ensure exactly one release label exists
        uses: actions/github-script@v8
        with:
          script: |
            const allowed = ["release:major", "release:minor", "release:patch"];
            const labels = (context.payload.pull_request.labels || [])
              .map((label) => label.name)
              .filter(Boolean);
            const selected = allowed.filter((label) => labels.includes(label));

            core.info(`Labels on PR: ${labels.join(", ") || "none"}`);
            core.info(`Release labels: ${selected.join(", ") || "none"}`);

            if (selected.length !== 1) {
              core.setFailed(
                `PRs targeting main must contain exactly one release label: ${allowed.join(", ")}. Found: ${selected.join(", ") || "none"}.`
              );
            }